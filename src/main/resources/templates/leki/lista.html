<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Magazyn Leków</h1>
        <a href="/leki/nowy" class="btn btn-success">+ Dodaj Lek</a>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form action="/leki" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj leku (Nazwa, Substancja lub EAN)..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/leki}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>
                        <a th:href="@{/leki(szukaj=${param.szukaj}, page=0, sortField='kodEan', sortDir=${sortField == 'kodEan' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            EAN
                            <span th:if="${sortField == 'kodEan'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'kodEan'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/leki(szukaj=${param.szukaj}, page=0, sortField='nazwaHandlowa', sortDir=${sortField == 'nazwaHandlowa' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Nazwa Handlowa
                            <span th:if="${sortField == 'nazwaHandlowa'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'nazwaHandlowa'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/leki(szukaj=${param.szukaj}, page=0, sortField='substancjaCzynna', sortDir=${sortField == 'substancjaCzynna' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Substancja
                            <span th:if="${sortField == 'substancjaCzynna'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'substancjaCzynna'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/leki(szukaj=${param.szukaj}, page=0, sortField='stanMagazynowy', sortDir=${sortField == 'stanMagazynowy' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Stan
                            <span th:if="${sortField == 'stanMagazynowy'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'stanMagazynowy'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${leki.content}">
                    <td th:text="${l.kodEan}" class="fw-bold"></td>
                    <td th:text="${l.nazwaHandlowa}" style="max-width: 250px;"></td>
                    <td th:text="${l.substancjaCzynna}" style="max-width: 250px;"></td>
                    <td>
                            <span th:text="${l.stanMagazynowy} + ' ' + ${l.jednostkaMiary}"
                                  th:class="${l.stanMagazynowy < 10} ? 'text-danger fw-bold' : ''"></span>
                    </td>
                    <td>
                        <a th:href="@{/leki/edytuj/{id}(id=${l.kodEan})}" class="btn btn-sm btn-warning">Edytuj</a>
                        <a th:href="@{/leki/usun/{id}(id=${l.kodEan})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Czy na pewno usunąć ten lek?')">Usuń</a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${leki.totalPages > 1}" class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${leki.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/leki(szukaj=${param.szukaj}, page=${leki.number - 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, leki.totalPages - 1)}"
                            th:classappend="${i == leki.number} ? 'active'">
                            <a class="page-link" th:href="@{/leki(szukaj=${param.szukaj}, page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${leki.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/leki(szukaj=${param.szukaj}, page=${leki.number + 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="text-center text-muted small mt-2" th:if="${leki.totalElements > 0}">
                Strona <span th:text="${leki.number + 1}"></span> z <span th:text="${leki.totalPages}"></span>
                (Łącznie <span th:text="${leki.totalElements}"></span> leków)
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
