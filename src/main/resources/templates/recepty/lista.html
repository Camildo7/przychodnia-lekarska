<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Rejestr Recept</h1>
        <a href="/recepty/nowa" class="btn btn-success">+ Wystaw Receptę</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form action="/recepty" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj (Kod, Pacjent, Lekarz, Data)..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/recepty}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(recepty)}" class="text-center py-4 text-muted">
                Brak recept spełniających kryteria.
            </div>

            <table class="table table-hover" th:if="${!#lists.isEmpty(recepty)}">
                <thead class="table-light">
                <tr>
                    <th>
                        <a th:href="@{/recepty(szukaj=${param.szukaj}, sortField='kodDokumentu', sortDir=${sortField == 'kodDokumentu' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Kod
                            <span th:if="${sortField == 'kodDokumentu'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'kodDokumentu'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/recepty(szukaj=${param.szukaj}, sortField='pacjent.nazwisko', sortDir=${sortField == 'pacjent.nazwisko' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Pacjent
                            <span th:if="${sortField == 'pacjent.nazwisko'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'pacjent.nazwisko'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/recepty(szukaj=${param.szukaj}, sortField='lekarz.nazwisko', sortDir=${sortField == 'lekarz.nazwisko' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Lekarz
                            <span th:if="${sortField == 'lekarz.nazwisko'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'lekarz.nazwisko'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/recepty(szukaj=${param.szukaj}, sortField='dataWystawienia', sortDir=${sortField == 'dataWystawienia' ? reverseSortDir : 'desc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Data
                            <span th:if="${sortField == 'dataWystawienia'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'dataWystawienia'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${recepty}">
                    <td th:text="${r.kodDokumentu}" class="fw-bold"></td>
                    <td>
                        <div th:text="${r.pacjent.nazwisko} + ' ' + ${r.pacjent.imie}"></div>
                        <small class="text-muted" th:text="${r.pacjent.pesel}"></small>
                    </td>
                    <td th:text="${r.lekarz.nazwisko} + ' ' + ${r.lekarz.imie}"></td>
                    <td th:text="${r.dataWystawienia}"></td>
                    <td>
                        <div class="btn-group">
                            <a th:href="@{/recepty/szczegoly(kod=${r.kodDokumentu}, pesel=${r.pacjent.pesel})}"
                               class="btn btn-sm btn-info text-white">Szczegóły</a>
                            <a th:href="@{/recepty/usun(kod=${r.kodDokumentu}, pesel=${r.pacjent.pesel})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Czy na pewno usunąć całą receptę i wszystkie jej pozycje?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
