<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="card mb-4">
        <div class="card-header bg-light">
            <strong>Recepta: <span th:text="${recepta.kodDokumentu}"></span></strong>
        </div>
        <div class="card-body row">
            <div class="col-md-4">
                <p>Pacjent: <strong th:text="${recepta.pacjent.nazwisko} + ' ' + ${recepta.pacjent.imie}"></strong></p>
                <p>PESEL: <span th:text="${recepta.pacjent.pesel}"></span></p>
            </div>
            <div class="col-md-4">
                <p>Lekarz: <strong th:text="${recepta.lekarz.nazwisko}"></strong></p>
                <p>Data wystawienia: <span th:text="${recepta.dataWystawienia}"></span></p>
            </div>
        </div>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-secondary text-white">Dodaj Lek</div>
                <div class="card-body">
                    <form action="/recepty/dodaj-pozycje" method="post">
                        <input type="hidden" name="kodDok" th:value="${recepta.kodDokumentu}">
                        <input type="hidden" name="pesel" th:value="${recepta.pacjent.pesel}">

                        <div class="mb-3">
                            <label>Lek:</label>
                            <select name="kodLeku" class="form-select" required>
                                <option th:each="l : ${leki}"
                                        th:value="${l.kodEan}"
                                        th:text="${l.nazwaHandlowa} + ' (Stan: ' + ${l.stanMagazynowy} + ')'">
                                </option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Ilość:</label>
                            <input type="number" name="ilosc" class="form-control" value="1" min="1" required>
                        </div>
                        <div class="mb-3">
                            <label>Dawkowanie:</label>
                            <input type="text" name="dawkowanie" class="form-control" placeholder="np. 1x dziennie" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Dodaj pozycję</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <h3>Lista leków na recepcie</h3>
            <table class="table table-bordered">
                <thead class="table-light">
                <tr>
                    <th>Nazwa Leku</th>
                    <th>Ilość</th>
                    <th>Dawkowanie</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pozycje}">
                    <td th:text="${p.lek.nazwaHandlowa}"></td>
                    <td th:text="${p.iloscOpakowan}"></td>
                    <td th:text="${p.dawkowanie}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(pozycje)}">
                    <td colspan="3" class="text-center text-muted">Brak leków na tej recepcie.</td>
                </tr>
                </tbody>
            </table>
            <a href="/recepty" class="btn btn-outline-secondary mt-3">Wróć do listy recept</a>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
