<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow mt-4">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        Edycja leku na recepcie
                    </h4>
                </div>

                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger d-flex align-items-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill flex-shrink-0 me-2"></i>
                        <div th:text="${error}"></div>
                    </div>

                    <div class="p-3 mb-4 bg-light border rounded">
                        <div class="row text-center">
                            <div class="col-6 border-end">
                                <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 1px;">Magazyn</small>
                                <div class="mt-1">
                                    <strong class="fs-5 text-dark" th:text="${stanMagazynowy}"></strong> <small class="text-muted">szt.</small>
                                </div>
                            </div>
                            <div class="col-6">
                                <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.7rem; letter-spacing: 1px;">Recepta</small>
                                <div class="mt-1">
                                    <strong class="fs-5 text-dark" th:text="${pozycja.iloscOpakowan}"></strong> <small class="text-muted">szt.</small>
                                </div>
                            </div>
                        </div>

                        <hr class="my-2">

                        <div class="text-center mt-2">
                            <span class="text-muted">Maksymalny limit:</span>
                            <strong class="text-primary ms-1">
                                <span th:text="${maxIlosc}"></span> szt.
                            </strong>
                        </div>
                    </div>
                    <form action="/recepty/zapisz-pozycje" method="post">
                        <input type="hidden" name="kod" th:value="${pozycja.kodDokumentu}">
                        <input type="hidden" name="pesel" th:value="${pozycja.pesel}">
                        <input type="hidden" name="ean" th:value="${pozycja.lek.kodEan}">

                        <div class="mb-3">
                            <label class="form-label text-muted">Wybrany lek:</label>
                            <input type="text" class="form-control fw-bold bg-light"
                                   th:value="${pozycja.lek.nazwaHandlowa} + ' (' + ${pozycja.lek.substancjaCzynna} + ')'"
                                   readonly
                                   tabindex="-1"
                                   style="box-shadow: none !important; border-color: #dee2e6 !important; outline: none !important; cursor: default;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nowa ilość opakowań:</label>
                            <div class="input-group">
                                <input type="number" name="ilosc" class="form-control form-control-lg"
                                       th:value="${pozycja.iloscOpakowan}"
                                       min="1"
                                       th:max="${maxIlosc}"
                                       oninput="if(this.value.length > 3) this.value = this.value.slice(0, 3);"
                                       required>
                                <span class="input-group-text">szt.</span>
                            </div>
                            <div class="form-text text-muted">
                                Limit dostępności: <span th:text="${maxIlosc}"></span> szt.
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Dawkowanie:</label>
                            <div class="input-group">
                                <input type="text" name="dawkowanie" class="form-control"
                                       th:value="${pozycja.dawkowanie}"
                                       placeholder="np. 1x1 rano" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Zapisz zmiany
                            </button>
                            <a th:href="@{/recepty/szczegoly(kod=${pozycja.kodDokumentu}, pesel=${pozycja.pesel})}"
                               class="btn btn-outline-secondary btn-lg">Anuluj
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
