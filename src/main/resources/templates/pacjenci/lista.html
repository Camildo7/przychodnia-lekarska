<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Baza Pacjentów</h1>
        <a href="/pacjenci/nowy" class="btn btn-success">+ Dodaj Pacjenta</a>
    </div>

    <form action="/pacjenci" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Wpisz nazwisko pacjenta..." th:value="${param.szukaj}">
            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div class="card">
        <div class="card-body">
            <table class="table">
                <thead>
                <tr>
                    <th>PESEL</th>
                    <th>Imię i Nazwisko</th>
                    <th>Adres</th>
                    <th>Telefon</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pacjenci}">
                    <td th:text="${p.pesel}"></td>
                    <td th:text="${p.nazwisko} + ' ' + ${p.imie}"></td>
                    <td th:text="${p.adresZamieszkania}"></td>
                    <td th:text="${p.telefonKontaktowy}"></td>
                    <td><a th:href="@{/pacjenci/historia/{id}(id=${p.pesel})}" class="btn btn-sm btn-info">Historia Chorób</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
