<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Baza Pacjentów</h1>
        <a href="/pacjenci/nowy" class="btn btn-success">+ Dodaj Pacjenta</a>
    </div>

    <div th:if="${param.error}" class="alert alert-danger">
        <span th:text="${param.error}">Wystąpił błąd.</span>
    </div>

    <form action="/pacjenci" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Wpisz nazwisko pacjenta..." th:value="${param.szukaj}">
            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>PESEL</th>
                    <th>Imię i Nazwisko</th>
                    <th>Adres / Kontakt</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pacjenci}">
                    <td th:text="${p.pesel}" class="fw-bold"></td>
                    <td th:text="${p.nazwisko} + ' ' + ${p.imie}"></td>
                    <td>
                        <div th:text="${p.adresZamieszkania}"></div>
                        <small class="text-muted" th:text="'Tel: ' + ${p.telefonKontaktowy}"></small>
                        <small class="text-muted" th:if="${p.email}" th:text="' | Email: ' + ${p.email}"></small>
                    </td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/pacjenci/historia/{id}(id=${p.pesel})}" class="btn btn-sm btn-info text-white">
                                Historia
                            </a>
                            <a th:href="@{/pacjenci/edytuj/{id}(id=${p.pesel})}" class="btn btn-sm btn-warning">
                                Edytuj
                            </a>
                            <a th:href="@{/pacjenci/usun/{id}(id=${p.pesel})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Czy na pewno usunąć tego pacjenta?')">
                                Usuń
                            </a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
