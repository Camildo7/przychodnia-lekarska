<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Dodaj Nowego Pacjenta</div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form action="/pacjenci/dodaj" method="post">
                        <div class="mb-3">
                            <label>PESEL *</label>
                            <input type="text" name="pesel" class="form-control" maxlength="11" required>
                        </div>
                        <div class="mb-3">
                            <label>Imię *</label>
                            <input type="text" name="imie" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Nazwisko *</label>
                            <input type="text" name="nazwisko" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Adres *</label>
                            <input type="text" name="adresZamieszkania" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label>Telefon *</label>
                            <input type="text" name="telefonKontaktowy" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Zapisz (Procedura)</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
