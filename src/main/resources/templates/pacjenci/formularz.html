<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0" th:text="${isEdit ? 'Edycja Pacjenta' : 'Nowy Pacjent'}">Dane Pacjenta</h4>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form action="/pacjenci/zapisz" method="post" th:object="${pacjent}">

                <input type="hidden" name="isEdit" th:value="${isEdit}">

                <div class="mb-3">
                    <label>PESEL *</label>
                    <input type="text" th:field="*{pesel}" class="form-control"
                           th:readonly="${isEdit}"
                           th:classappend="${#fields.hasErrors('pesel')} ? 'is-invalid' : ''"
                           required maxlength="11" placeholder="11 cyfr">
                    <div class="invalid-feedback" th:errors="*{pesel}">Błąd PESEL</div>
                    <div class="form-text" th:if="${isEdit}">Numeru PESEL nie można edytować.</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Imię *</label>
                        <input type="text" th:field="*{imie}" id="imieInput" class="form-control"
                               th:classappend="${#fields.hasErrors('imie')} ? 'is-invalid' : ''" maxlength="50" required>
                        <div class="invalid-feedback" th:errors="*{imie}">Błąd podczas wprowadzania imienia</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Nazwisko *</label>
                        <input type="text" th:field="*{nazwisko}" id="nazwiskoInput" class="form-control"
                               th:classappend="${#fields.hasErrors('nazwisko')} ? 'is-invalid' : ''" maxlength="50" required>
                        <div class="invalid-feedback" th:errors="*{nazwisko}">Błąd podczas wprowadzania nazwiska</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Adres Zamieszkania *</label>
                    <input type="text" th:field="*{adresZamieszkania}" class="form-control"
                           th:classappend="${#fields.hasErrors('adresZamieszkania')} ? 'is-invalid' : ''" maxlength="150" required>
                    <div class="invalid-feedback" th:errors="*{adresZamieszkania}">Błąd adresu</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Telefon *</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text">📞</span>
                            <input type="text" th:field="*{telefonKontaktowy}" class="form-control"
                                   id="phoneInput"
                                   placeholder="+48 600 100 200"
                                   maxlength="15"
                                   th:classappend="${#fields.hasErrors('telefonKontaktowy')} ? 'is-invalid' : ''"
                                   required>
                            <div class="invalid-feedback" th:errors="*{telefonKontaktowy}">
                                Format: +48 600 100 200
                            </div>
                        </div>
                        <div class="form-text">Wymagany format: +48 123 456 789 (ze spacjami)</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" th:field="*{email}" class="form-control"
                               th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''" maxlength="100" >
                        <div class="invalid-feedback" th:errors="*{email}">Błąd email</div>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Zapisz Pacjenta</button>
                    <a href="/pacjenci" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                </div>

            </form>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>
</body>
<script>
    const phoneInput = document.getElementById('phoneInput');

    if (phoneInput) {
        phoneInput.addEventListener('input', function (e) {
            let rawValue = e.target.value;

            if (rawValue === '') return;

            let digits = rawValue.replace(/\D/g, '');

            if (digits.length === 0 && rawValue.includes('+')) {
                e.target.value = '+';
                return;
            }

            let x = digits.match(/(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,3})/);

            if (x) {
                e.target.value = '+' + x[1] +
                    (x[2] ? ' ' + x[2] : '') +
                    (x[3] ? ' ' + x[3] : '') +
                    (x[4] ? ' ' + x[4] : '');
            }
        });

        if (phoneInput.value !== "") {
            phoneInput.dispatchEvent(new Event('input'));
        }

        const capitalizeFirstLetter = (e) => {
            let val = e.target.value;
            if (val.length > 0) {
                e.target.value = val.charAt(0).toUpperCase() + val.slice(1);
            }
        };


        const imieInput = document.getElementById('imieInput');
        const nazwiskoInput = document.getElementById('nazwiskoInput');

        if (imieInput) {
            imieInput.addEventListener('input', capitalizeFirstLetter);
        }
        if (nazwiskoInput) {
            nazwiskoInput.addEventListener('input', capitalizeFirstLetter);
        }
    }
</script>

</html>
