<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">Dodaj Nowego Pacjenta</div>
                <div class="card-body">

                    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                    <form action="/pacjenci/dodaj" method="post" th:object="${pacjent}">

                        <div class="mb-3">
                            <label>PESEL *</label>
                            <input type="text" th:field="*{pesel}" class="form-control"
                                   th:classappend="${#fields.hasErrors('pesel')} ? 'is-invalid' : ''"
                                   maxlength="11">
                            <div class="invalid-feedback" th:errors="*{pesel}">Błąd PESEL</div>
                        </div>

                        <div class="mb-3">
                            <label>Imię *</label>
                            <input type="text" th:field="*{imie}" class="form-control"
                                   th:classappend="${#fields.hasErrors('imie')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{imie}">Błąd imienia</div>
                        </div>

                        <div class="mb-3">
                            <label>Nazwisko *</label>
                            <input type="text" th:field="*{nazwisko}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nazwisko')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{nazwisko}">Błąd nazwiska</div>
                        </div>

                        <div class="mb-3">
                            <label>Adres *</label>
                            <input type="text" th:field="*{adresZamieszkania}" class="form-control"
                                   th:classappend="${#fields.hasErrors('adresZamieszkania')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{adresZamieszkania}">Błąd adresu</div>
                        </div>

                        <div class="mb-3">
                            <label>Telefon *</label>
                            <input type="text" th:field="*{telefonKontaktowy}" class="form-control"
                                   th:classappend="${#fields.hasErrors('telefonKontaktowy')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{telefonKontaktowy}">Błąd telefonu</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Zapisz (Procedura)</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
