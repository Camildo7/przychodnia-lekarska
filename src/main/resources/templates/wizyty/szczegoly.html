<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h2>Szczegóły Wizyty nr <span th:text="${w.numerWizyty}"></span></h2>
        <a href="/kalendarz" class="btn btn-outline-secondary">← Wróć do kalendarza</a>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card shadow mb-4">
                <div class="card-header bg-secondary text-white">Dane Wizyty</div>
                <div class="card-body">
                    <form action="/wizyta/zapisz" method="post">
                        <input type="hidden" name="numerWizyty" th:value="${w.numerWizyty}">

                        <div class="mb-3">
                            <label>Pacjent:</label>
                            <input type="text" class="form-control" th:value="${w.pacjent.nazwisko} + ' ' + ${w.pacjent.imie}" disabled>
                        </div>

                        <div class="mb-3">
                            <label>Data i Czas:</label>
                            <input type="datetime-local" name="dataIGodzina" class="form-control"
                                   th:value="${w.dataIGodzina}" required>
                        </div>

                        <div class="mb-3">
                            <label>Czas trwania:</label>
                            <input type="text" class="form-control" value="30 minut (Standard)" disabled>
                        </div>

                        <div class="mb-3">
                            <label>Lekarz:</label>
                            <select name="lekarz" class="form-select">
                                <option th:each="l : ${lekarze}" th:value="${l.numerPwz}"
                                        th:text="${l.nazwisko} + ' ' + ${l.imie}"
                                        th:selected="${l.numerPwz == w.lekarz.numerPwz}"></option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label>Gabinet:</label>
                            <select name="gabinet" class="form-select">
                                <option th:each="g : ${gabinety}" th:value="${g.numerGabinetu}"
                                        th:text="'Gabinet ' + ${g.numerGabinetu}"
                                        th:selected="${w.gabinet != null && w.gabinet.numerGabinetu == g.numerGabinetu}"></option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-warning w-100"
                                th:disabled="${w.czyOdbyta == 'T'}">Zapisz Zmiany</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-6">

            <div class="card shadow border-success" th:if="${w.czyOdbyta == 'T'}">
                <div class="card-header bg-success text-white">Wizyta Zakończona</div>
                <div class="card-body">
                    <h5>Zalecenia:</h5>
                    <p class="fst-italic" th:text="${w.zalecenia}"></p>
                    <hr>
                    <h5>Zdiagnozowane choroby:</h5>
                    <ul>
                        <li th:each="c : ${w.choroby}" th:text="${c.nazwaChoroby}"></li>
                        <li th:if="${#lists.isEmpty(w.choroby)}" class="text-muted">Brak przypisanych chorób.</li>
                    </ul>
                </div>
            </div>

            <div class="card shadow border-primary" th:if="${w.czyOdbyta == 'N'}">
                <div class="card-header bg-primary text-white">Przebieg Wizyty</div>
                <div class="card-body">
                    <form action="/wizyta/zakoncz-pelna" method="post">
                        <input type="hidden" name="idWizyty" th:value="${w.numerWizyty}">

                        <div class="mb-3">
                            <label class="fw-bold">Zalecenia lekarskie:</label>
                            <textarea name="zalecenia" class="form-control" rows="4" placeholder="Wpisz zalecenia dla pacjenta..." required></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="fw-bold">Diagnoza (Zaznacz choroby):</label>
                            <div class="border p-2 bg-light" style="max-height: 200px; overflow-y: auto;">
                                <div th:each="c : ${choroby}" class="form-check">
                                    <input class="form-check-input" type="checkbox" name="kodyChorob"
                                           th:value="${c.kodIcd10}" th:id="'c_'+${c.kodIcd10}">
                                    <label class="form-check-label" th:for="'c_'+${c.kodIcd10}"
                                           th:text="${c.nazwaChoroby} + ' (' + ${c.kodIcd10} + ')'"></label>
                                </div>
                            </div>
                            <div class="form-text">Możesz zaznaczyć wiele chorób.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 btn-lg">Zakończ Wizytę</button>
                    </form>
                </div>
            </div>

            <div class="mt-3 text-center">
                <a th:href="@{/recepty/nowa(idWizyty=${w.numerWizyty})}" class="btn btn-outline-info w-100">Wystaw Receptę do tej wizyty</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
