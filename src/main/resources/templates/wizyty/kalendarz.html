<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>

<head>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
</head>

<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container-fluid px-4">
    <div class="row mb-3 align-items-end">
        <div class="col-md-3">
            <label class="fw-bold">Filtruj wg lekarza:</label>
            <select id="lekarzFilter" class="form-select select2" data-placeholder="Wyszukaj lekarza">
                <option></option> <option th:each="l : ${lekarze}" th:value="${l.numerPwz}" th:text="${l.nazwisko} + ' ' + ${l.imie}"></option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="fw-bold">Filtruj wg pacjenta:</label>
            <select id="pacjentFilter" class="form-select select2" data-placeholder="Wyszukaj pacjenta">
                <option></option>
                <option th:each="p : ${pacjenci}" th:value="${p.pesel}"
                        th:text="${p.nazwisko} + ' ' + ${p.imie} + ' (' + ${p.pesel} + ')'"></option>
            </select>
        </div>

        <div class="col-md-3">
            <a href="/nowa" class="btn btn-success">+ Zarejestruj Wizytę</a>
        </div>
        <div class="col-md-3 text-end">
            <span class="badge bg-primary">Planowana</span>
            <span class="badge bg-success">Zakończona</span>
        </div>
    </div>

    <div class="card shadow">
        <div class="card-body">
            <div id='calendar'></div>
        </div>
    </div>
</div>

<div th:replace="~{layout :: scripts}"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/i18n/pl.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {

        $('.select2').select2({
            theme: 'bootstrap-5',
            language: "pl",
            width: '100%',
            allowClear: true,
            placeholder: $(this).data('placeholder')
        });

        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            height: '75vh',
            slotMinTime: '00:00:00', // Początek dnia w kalendarzu
            slotMaxTime: '24:00:00', // Koniec dnia
            scrollTime: '08:00:00', //  Pozycja początkowa
            allDaySlot: false,
            locale: 'pl',
            firstDay: 1,
            navLinks: true,
            nowIndicator: true,
            events: '/api/wizyty',

            eventClick: function(info) {
                window.location.href = '/wizyta/' + info.event.id;
            },

            eventDidMount: function(info) {
                info.el.style.cursor = 'pointer';
            }
        });
        calendar.render();

        function refreshCalendar() {
            var lekarzId = $('#lekarzFilter').val();
            var pesel = $('#pacjentFilter').val();

            var newUrl = '/api/wizyty?';
            if (lekarzId) newUrl += 'lekarzId=' + lekarzId + '&';
            if (pesel) newUrl += 'pesel=' + pesel;

            calendar.removeAllEventSources();
            calendar.addEventSource(newUrl);
        }

        $('#lekarzFilter, #pacjentFilter').on('change', function() {
            refreshCalendar();
        });
    });
</script>

</body>
</html>
