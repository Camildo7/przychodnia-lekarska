<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Słownik Specjalizacji</h1>
        <a href="/admin/specjalizacje/nowa" class="btn btn-success">+ Dodaj Specjalizację</a>
    </div>

    <form action="/admin/specjalizacje" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj specjalizacji..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/admin/specjalizacje}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">
        Nie można usunąć (specjalizacja przypisana do lekarza).
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>
                        <a th:href="@{/admin/specjalizacje(szukaj=${param.szukaj}, page=0, sortField='nazwaSpecjalizacji', sortDir=${sortField == 'nazwaSpecjalizacji' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Nazwa
                            <span th:if="${sortField == 'nazwaSpecjalizacji'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'nazwaSpecjalizacji'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/admin/specjalizacje(szukaj=${param.szukaj}, page=0, sortField='opis', sortDir=${sortField == 'opis' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Opis
                            <span th:if="${sortField == 'opis'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'opis'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>Akcja</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="s : ${specjalizacje.content}">
                    <td th:text="${s.nazwaSpecjalizacji}" class="fw-bold" style="max-width: 250px;"></td>
                    <td th:text="${s.opis}" style="max-width: 250px;"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/admin/specjalizacje/edytuj/{id}(id=${s.nazwaSpecjalizacji})}" class="btn btn-sm btn-warning">Edytuj</a>
                            <a th:href="@{/admin/specjalizacje/usun/{id}(id=${s.nazwaSpecjalizacji})}"
                               class="btn btn-sm btn-danger" onclick="return confirm('Usunąć?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>

            <div th:if="${specjalizacje.totalPages > 1}" class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${specjalizacje.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/specjalizacje(szukaj=${param.szukaj}, page=${specjalizacje.number - 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, specjalizacje.totalPages - 1)}"
                            th:classappend="${i == specjalizacje.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/specjalizacje(szukaj=${param.szukaj}, page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${specjalizacje.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/specjalizacje(szukaj=${param.szukaj}, page=${specjalizacje.number + 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="text-center text-muted small mt-2" th:if="${specjalizacje.totalElements > 0}">
                Strona <span th:text="${specjalizacje.number + 1}"></span> z <span th:text="${specjalizacje.totalPages}"></span>
                (Łącznie <span th:text="${specjalizacje.totalElements}"></span> specjalizacji)
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
