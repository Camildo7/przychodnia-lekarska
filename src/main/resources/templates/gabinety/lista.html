<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Zarządzanie Gabinetami</h1>
        <a href="/admin/gabinety/nowy" class="btn btn-success">+ Dodaj Gabinet</a>
    </div>

    <form action="/admin/gabinety" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj gabinetu (Opis funkcji)..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/admin/gabinety}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">
        Gabinet jest używany i nie może zostać usunięty.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>
                        <a th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=0, sortField='numerGabinetu', sortDir=${sortField == 'numerGabinetu' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Numer
                            <span th:if="${sortField == 'numerGabinetu'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'numerGabinetu'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=0, sortField='pietro', sortDir=${sortField == 'pietro' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Piętro
                            <span th:if="${sortField == 'pietro'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'pietro'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>
                        <a th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=0, sortField='opisFunkcji', sortDir=${sortField == 'opisFunkcji' ? reverseSortDir : 'asc'})}"
                           class="text-decoration-none text-dark d-flex justify-content-between align-items-center">
                            Opis Funkcji
                            <span th:if="${sortField == 'opisFunkcji'}"><i th:class="${sortDir == 'asc' ? 'bi bi-caret-up-fill' : 'bi bi-caret-down-fill'}"></i></span>
                            <span th:unless="${sortField == 'opisFunkcji'}" class="text-muted opacity-25"><i class="bi bi-arrow-down-up"></i></span>
                        </a>
                    </th>
                    <th>Akcja</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${gabinety.content}">
                    <td th:text="${g.numerGabinetu}" class="fw-bold"></td>
                    <td th:text="${g.pietro}"></td>
                    <td th:text="${g.opisFunkcji}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/admin/gabinety/edytuj/{id}(id=${g.numerGabinetu})}" class="btn btn-sm btn-warning">Edytuj</a>
                            <a th:href="@{/admin/gabinety/usun/{id}(id=${g.numerGabinetu})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Usunąć gabinet?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div th:if="${gabinety.totalPages > 1}" class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination">

                        <li class="page-item" th:classappend="${gabinety.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=${gabinety.number - 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&laquo;</span>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, gabinety.totalPages - 1)}"
                            th:classappend="${i == gabinety.number} ? 'active'">
                            <a class="page-link" th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${gabinety.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/gabinety(szukaj=${param.szukaj}, page=${gabinety.number + 1}, sortField=${sortField}, sortDir=${sortDir})}">
                                <span>&raquo;</span>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

            <div class="text-center text-muted small mt-2" th:if="${gabinety.totalElements > 0}">
                Strona <span th:text="${gabinety.number + 1}"></span> z <span th:text="${gabinety.totalPages}"></span>
                (Łącznie <span th:text="${gabinety.totalElements}"></span> gabinetów)
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
