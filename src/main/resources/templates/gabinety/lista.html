<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Zarządzanie Gabinetami</h1>
        <a href="/admin/gabinety/nowy" class="btn btn-success">+ Dodaj Gabinet</a>
    </div>

    <form action="/admin/gabinety" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj gabinetu (Opis funkcji)..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/admin/gabinety}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">
        Gabinet jest używany i nie może zostać usunięty.
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Numer</th>
                    <th>Piętro</th>
                    <th>Opis Funkcji</th>
                    <th>Akcja</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="g : ${gabinety}">
                    <td th:text="${g.numerGabinetu}" class="fw-bold"></td>
                    <td th:text="${g.pietro}"></td>
                    <td th:text="${g.opisFunkcji}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/admin/gabinety/edytuj/{id}(id=${g.numerGabinetu})}" class="btn btn-sm btn-warning">Edytuj</a>
                            <a th:href="@{/admin/gabinety/usun/{id}(id=${g.numerGabinetu})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Usunąć gabinet?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
