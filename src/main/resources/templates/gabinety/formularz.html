<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="card shadow col-md-6 mx-auto">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Dane Gabinetu</h4>
        </div>
        <div class="card-body">

            <form action="/admin/gabinety/zapisz" method="post" th:object="${gabinet}">
                <input type="hidden" th:field="*{numerGabinetu}">

                <div class="mb-3">
                    <label class="fw-bold">Piętro *</label>
                    <input type="number" th:field="*{pietro}" class="form-control"
                           th:classappend="${#fields.hasErrors('pietro')} ? 'is-invalid' : ''"
                           min="0" max="99"
                           oninput="if(this.value.length > 2) this.value = this.value.slice(0, 2);"
                           required>

                    <div class="invalid-feedback" th:errors="*{pietro}">Błąd danych piętra</div>
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Opis Funkcji *</label>
                    <input type="text" th:field="*{opisFunkcji}" class="form-control"
                           th:classappend="${#fields.hasErrors('opisFunkcji')} ? 'is-invalid' : ''"
                           placeholder="np. Zabiegowy" required maxlength="255">

                    <div class="invalid-feedback" th:errors="*{opisFunkcji}">Błąd opisu</div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Zapisz Gabinet</button>
                    <a href="/admin/gabinety" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
