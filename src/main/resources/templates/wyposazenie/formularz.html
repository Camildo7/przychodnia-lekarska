<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0" th:text="${isEdit ? 'Edycja Wyposażenia' : 'Nowy Sprzęt'}">Dane Sprzętu</h4>
        </div>
        <div class="card-body">

            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form action="/wyposazenie/zapisz" method="post" th:object="${wyposazenie}">

                <input type="hidden" name="isEdit" th:value="${isEdit}">

                <div class="mb-3">
                    <label>Kod Inwentarzowy *</label>
                    <input type="text" th:field="*{kodInwentarzowy}" class="form-control"
                           placeholder="np. USG-2026-01"
                           th:readonly="${isEdit}"
                           th:classappend="${#fields.hasErrors('kodInwentarzowy')} ? 'is-invalid' : ''"
                           required maxlength="20">
                    <div class="invalid-feedback" th:errors="*{kodInwentarzowy}">Błąd kodu</div>
                    <div class="form-text" th:if="${isEdit}">Kodu inwentarzowego nie można edytować.</div>
                </div>

                <div class="mb-3">
                    <label>Nazwa Sprzętu *</label>
                    <input type="text" th:field="*{nazwaSprzetu}" class="form-control"
                           th:classappend="${#fields.hasErrors('nazwaSprzetu')} ? 'is-invalid' : ''"
                           required maxlength="100">
                    <div class="invalid-feedback" th:errors="*{nazwaSprzetu}">Błąd nazwy</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Data Zakupu *</label>
                        <input type="date" th:field="*{dataZakupu}" class="form-control"
                               th:classappend="${#fields.hasErrors('dataZakupu')} ? 'is-invalid' : ''"
                               required max="9999-12-31">
                        <div class="invalid-feedback" th:errors="*{dataZakupu}">Błąd daty zakupu</div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Data Przeglądu</label>
                        <input type="date" th:field="*{dataPrzegladu}" class="form-control"
                               th:classappend="${#fields.hasErrors('dataPrzegladu')} ? 'is-invalid' : ''"
                               max="2099-12-31">
                        <div class="invalid-feedback" th:errors="*{dataPrzegladu}">Błąd daty przeglądu</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Lokalizacja (Gabinet) *</label>
                    <select th:field="*{gabinet}" class="form-select"
                            th:classappend="${#fields.hasErrors('gabinet')} ? 'is-invalid' : ''" required>
                        <option value="" disabled selected>-- Wybierz lokalizację --</option>
                        <option th:each="g : ${gabinety}"
                                th:value="${g.numerGabinetu}"
                                th:text="'Gabinet ' + ${g.numerGabinetu} + ' (' + ${g.opisFunkcji} + ')'">
                        </option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{gabinet}">Należy wybrać gabinet</div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Zapisz Sprzęt</button>
                    <a href="/wyposazenie" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                </div>

            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
