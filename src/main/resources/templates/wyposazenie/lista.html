<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Ewidencja Wyposażenia</h1>
        <a href="/wyposazenie/nowy" class="btn btn-success">+ Dodaj Sprzęt</a>
    </div>

    <form action="/wyposazenie" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj sprzętu (np. Fotel)..." th:value="${param.szukaj}">
            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>Kod Inwentarzowy</th>
                    <th>Nazwa Sprzętu</th>
                    <th>Lokalizacja (Gabinet)</th>
                    <th>Data Zakupu</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="w : ${sprzety}">
                    <td th:text="${w.kodInwentarzowy}" class="fw-bold"></td>
                    <td th:text="${w.nazwaSprzetu}"></td>
                    <td>
                        <span th:if="${w.gabinet != null}" th:text="'Gabinet ' + ${w.gabinet.numerGabinetu}"></span>
                        <span th:if="${w.gabinet == null}" class="text-muted">Magazyn</span>
                    </td>
                    <td th:text="${w.dataZakupu}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/wyposazenie/edytuj/{id}(id=${w.kodInwentarzowy})}" class="btn btn-sm btn-warning">Edytuj</a>
                            <a th:href="@{/wyposazenie/usun/{kod}(kod=${w.kodInwentarzowy})}"
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Usunąć ten sprzęt z ewidencji?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
