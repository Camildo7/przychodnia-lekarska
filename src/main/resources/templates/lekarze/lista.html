<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Personel Medyczny</h1>
        <a href="/lekarze/nowy" class="btn btn-success">+ Dodaj Lekarza</a>
    </div>

    <form action="/lekarze" method="get" class="mb-4">
        <div class="input-group">
            <input type="text" name="szukaj" class="form-control" placeholder="Szukaj lekarza (Nazwisko lub PWZ)..." th:value="${param.szukaj}">

            <a th:if="${param.szukaj != null && !#strings.isEmpty(param.szukaj)}" th:href="@{/lekarze}" class="btn btn-outline-secondary" title="Wyczyść filtr">&times;</a>

            <button class="btn btn-outline-primary" type="submit">Szukaj</button>
        </div>
    </form>

    <div th:if="${param.error}" class="alert alert-danger">
        Nie można usunąć lekarza (posiada wizyty lub recepty).
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <table class="table table-hover">
                <thead class="table-light">
                <tr>
                    <th>PWZ</th>
                    <th>Imię i Nazwisko</th>
                    <th>Specjalizacje</th>
                    <th>Telefon</th>
                    <th>Akcje</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="l : ${lekarze}">
                    <td th:text="${l.numerPwz}" class="fw-bold"></td>
                    <td th:text="${l.imie} + ' ' + ${l.nazwisko}"></td>
                    <td>
                        <span th:each="s : ${l.specjalizacje}" th:text="${s.nazwaSpecjalizacji}"
                              class="badge bg-info text-dark me-1"></span>
                    </td>
                    <td th:text="${l.telefonSluzbowy}"></td>
                    <td>
                        <div class="btn-group" role="group">
                            <a th:href="@{/lekarze/edytuj/{id}(id=${l.numerPwz})}" class="btn btn-sm btn-warning">Edytuj</a>
                            <a th:href="@{/lekarze/usun/{id}(id=${l.numerPwz})}" class="btn btn-sm btn-danger"
                               onclick="return confirm('Usunąć lekarza?')">Usuń</a>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
