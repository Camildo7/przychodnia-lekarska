<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-primary text-white">Dane Lekarza</div>
        <div class="card-body">
            <form action="/lekarze/zapisz" method="post" th:object="${lekarz}">

                <div class="mb-3">
                    <label>Numer PWZ *</label>
                    <input type="text" th:field="*{numerPwz}" class="form-control"
                           th:readonly="${lekarz.numerPwz != null}" required maxlength="7">
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Imię *</label>
                        <input type="text" th:field="*{imie}" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Nazwisko *</label>
                        <input type="text" th:field="*{nazwisko}" class="form-control" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Data Zatrudnienia *</label>
                    <input type="date" th:field="*{dataZatrudnienia}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label>Telefon</label>
                    <input type="text" th:field="*{telefonSluzbowy}" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="fw-bold">Specjalizacje:</label>
                    <div class="border p-2" style="max-height: 150px; overflow-y: auto;">
                        <div th:each="s : ${dostepneSpecjalizacje}" class="form-check">
                            <input type="checkbox" class="form-check-input"
                                   th:field="*{specjalizacje}"
                                   th:value="${s.nazwaSpecjalizacji}">
                            <label class="form-check-label" th:text="${s.nazwaSpecjalizacji}"></label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100">Zapisz</button>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
