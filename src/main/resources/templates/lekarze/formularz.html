<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>
<div class="container">
    <div class="card shadow col-md-8 mx-auto">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0" th:text="${isEdit ? 'Edycja Lekarza' : 'Nowy Lekarz'}">Dane Lekarza</h4>
        </div>
        <div class="card-body">

            <form action="/lekarze/zapisz" method="post" th:object="${lekarz}">

                <input type="hidden" name="isEdit" th:value="${isEdit}">

                <div class="mb-3">
                    <label>Numer PWZ *</label>
                    <input type="text" th:field="*{numerPwz}" class="form-control"
                           th:readonly="${isEdit}"
                           th:classappend="${#fields.hasErrors('numerPwz')} ? 'is-invalid' : ''"
                           required maxlength="7" placeholder="np. 1234567">
                    <div class="invalid-feedback" th:errors="*{numerPwz}">Błąd PWZ</div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label>Imię *</label>
                        <input type="text" th:field="*{imie}" id="imieInput" class="form-control"
                               th:classappend="${#fields.hasErrors('imie')} ? 'is-invalid' : ''"
                               required placeholder="np. Jan" maxlength="50">
                        <div class="invalid-feedback" th:errors="*{imie}">Błąd podczas wprowadzania imienia</div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label>Nazwisko *</label>
                        <input type="text" th:field="*{nazwisko}" id="nazwiskoInput" class="form-control"
                               th:classappend="${#fields.hasErrors('nazwisko')} ? 'is-invalid' : ''"
                               required placeholder="np. Kowalski" maxlength="50">
                        <div class="invalid-feedback" th:errors="*{nazwisko}">Błąd podczas wprowadzania nazwiska</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label>Data Zatrudnienia *</label>
                    <input type="date" th:field="*{dataZatrudnienia}" class="form-control"
                           th:classappend="${#fields.hasErrors('dataZatrudnienia')} ? 'is-invalid' : ''"
                           required max="9999-12-31">
                    <div class="invalid-feedback" th:errors="*{dataZatrudnienia}">Błąd daty</div>
                </div>

                <div class="mb-3">
                    <label>Telefon Służbowy *</label>
                    <input type="text" th:field="*{telefonSluzbowy}" id="telefonInput" class="form-control"
                           placeholder="+48 600 100 200"
                           maxlength="15"
                           th:classappend="${#fields.hasErrors('telefonSluzbowy')} ? 'is-invalid' : ''">

                    <div class="invalid-feedback" th:errors="*{telefonSluzbowy}">
                        Wymagany format: +48 600 100 200
                    </div>
                    <div class="form-text text-muted">
                        Wpisz numer np.: <strong>+48 600 123 456</strong>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Specjalizacje:</label>

                    <div class="input-group mb-2">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" id="specSearchInput" class="form-control form-control-sm"
                               placeholder="Wpisz, aby filtrować listę...">
                    </div>

                    <div class="border rounded p-2" style="max-height: 140px; overflow-y: auto; background-color: #fdfdfd;">

                        <div th:each="s : ${dostepneSpecjalizacje}" class="form-check border-bottom py-2 spec-row">
                            <input type="checkbox" class="form-check-input mt-1"
                                   th:field="*{specjalizacje}"
                                   th:value="${s.nazwaSpecjalizacji}"
                                   th:id="${'spec_' + s.nazwaSpecjalizacji}">

                            <label class="form-check-label w-100 cursor-pointer spec-label lh-sm"
                                   th:for="${'spec_' + s.nazwaSpecjalizacji}"
                                   style="cursor: pointer;">

                                <span class="fw-bold text-dark" th:text="${s.nazwaSpecjalizacji}"></span>

                                <span th:if="${s.opis != null && !#strings.isEmpty(s.opis)}"
                                      class="text-muted small ms-1 fst-italic">
                                    <br class="d-sm-none"> <span th:text="'— ' + ${s.opis}"></span>
                                </span>
                            </label>
                        </div>

                        <div id="noResultsMsg" class="text-muted text-center small fst-italic mt-2" style="display: none;">
                            Brak pasujących specjalizacji.
                        </div>

                        <div th:if="${#lists.isEmpty(dostepneSpecjalizacje)}" class="text-muted text-center small fst-italic">
                            Brak zdefiniowanych specjalizacji w bazie.
                        </div>
                    </div>

                    <div class="text-danger mt-1 small" th:if="${#fields.hasErrors('specjalizacje')}" th:errors="*{specjalizacje}"></div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Zapisz Lekarza</button>
                    <a href="/lekarze" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", function() {

        const searchInput = document.getElementById('specSearchInput');
        const specRows = document.querySelectorAll('.spec-row');
        const noResultsMsg = document.getElementById('noResultsMsg');

        if (searchInput) {
            searchInput.addEventListener('keyup', function(e) {
                const searchText = e.target.value.toLowerCase();
                let hasVisibleItems = false;

                specRows.forEach(row => {
                    const labelText = row.querySelector('.spec-label').innerText.toLowerCase();

                    if (labelText.includes(searchText)) {
                        row.style.display = "";
                        hasVisibleItems = true;
                    } else {
                        row.style.display = "none";
                    }
                });

                if (!hasVisibleItems && specRows.length > 0) {
                    noResultsMsg.style.display = "block";
                } else {
                    noResultsMsg.style.display = "none";
                }
            });
        }

        const phoneInput = document.getElementById('telefonInput');

        if (phoneInput) {
            phoneInput.addEventListener('input', function (e) {
                let rawValue = e.target.value;

                if (rawValue === '') return;

                let digits = rawValue.replace(/\D/g, '');

                if (digits.length === 0 && rawValue.includes('+')) {
                    e.target.value = '+';
                    return;
                }

                let x = digits.match(/(\d{0,2})(\d{0,3})(\d{0,3})(\d{0,3})/);

                if (x) {
                    e.target.value = '+' + x[1] +
                        (x[2] ? ' ' + x[2] : '') +
                        (x[3] ? ' ' + x[3] : '') +
                        (x[4] ? ' ' + x[4] : '');
                }
            });

            if (phoneInput.value !== "") {
                phoneInput.dispatchEvent(new Event('input'));
            }
        }

        const capitalizeFirstLetter = (e) => {
            let val = e.target.value;
            if (val.length > 0) {
                e.target.value = val.charAt(0).toUpperCase() + val.slice(1);
            }
        };

        const imieInput = document.getElementById('imieInput');
        const nazwiskoInput = document.getElementById('nazwiskoInput');

        if (imieInput) {
            imieInput.addEventListener('input', capitalizeFirstLetter);
        }
        if (nazwiskoInput) {
            nazwiskoInput.addEventListener('input', capitalizeFirstLetter);
        }
    });
</script>
</html>
