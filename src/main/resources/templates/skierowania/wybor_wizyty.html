<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="card shadow col-md-6 mx-auto mt-4">
        <div class="card-header bg-success text-white">
            <h4 class="mb-0">Krok 1: Wybierz wizytę</h4>
        </div>
        <div class="card-body">

            <div class="alert alert-light border mb-4">
                <span class="text-muted small">Wybierz wizytę, aby automatycznie uzupełnić dane pacjenta i lekarza na skierowaniu.</span>
            </div>

            <form action="/skierowania/nowe" method="get">
                <div class="mb-4">
                    <label class="form-label fw-bold">Dostępne wizyty:</label>
                    <select name="idWizyty" class="form-select" required>
                        <option value="" disabled selected>-- Kliknij, aby wybrać --</option>
                        <option th:each="w : ${wizyty}"
                                th:value="${w.numerWizyty}"
                                th:text="${#temporals.format(w.dataIGodzina, 'yyyy-MM-dd HH:mm')} + ' | ' + ${w.pacjent.nazwisko} + ' ' + ${w.pacjent.imie} + ' (Lek. ' + ${w.lekarz.nazwisko} + ')'">
                        </option>
                    </select>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success btn-lg">Dalej</button>
                    <a href="/skierowania" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                </div>
            </form>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
