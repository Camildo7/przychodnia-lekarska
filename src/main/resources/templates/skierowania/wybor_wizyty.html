<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: header}"></head>
<body>
<nav th:replace="~{layout :: navbar}"></nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow mt-5">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-calendar-event me-2"></i>Krok 1: Wybierz wizytę
                    </h4>
                </div>
                <div class="card-body">

                    <div class="alert alert-light border mb-4">
                        <i class="bi bi-info-circle-fill text-success me-2"></i>
                        <span class="text-muted">Skierowanie musi być powiązane z wizytą, aby automatycznie uzupełnić dane pacjenta.</span>
                    </div>

                    <form action="/skierowania/nowe" method="get">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Dostępne wizyty:</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="bi bi-person-lines-fill"></i></span>
                                <select name="idWizyty" class="form-select form-select-lg" required>
                                    <option value="" disabled selected>-- Kliknij, aby wybrać --</option>
                                    <option th:each="w : ${wizyty}"
                                            th:value="${w.numerWizyty}"
                                            th:text="${#temporals.format(w.dataIGodzina, 'yyyy-MM-dd HH:mm')} + ' | ' + ${w.pacjent.nazwisko} + ' ' + ${w.pacjent.imie}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">
                                Dalej <i class="bi bi-arrow-right"></i>
                            </button>
                            <a href="/skierowania" class="btn btn-outline-secondary btn-lg">Anuluj</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
